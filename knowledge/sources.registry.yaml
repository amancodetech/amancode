# Knowledge Layer — Source Registry (v1)
#
# Single reference for every external source cited by the knowledge packs.
# Internal AmanCode facts/pricing/claims are NOT listed here: they live in the
# Business Brain and are authoritative regardless of this registry.
#
# A pack's per-field `source` block may reference a source by `name` from this
# registry or embed the full provenance block directly. The registry guarantees
# consistency of organization / url / version / license across packs.

version: 1.0.0
last_verified: 2026-08-27

sources:
