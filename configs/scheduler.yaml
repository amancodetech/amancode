# Operational scheduler configuration (Phase 3H).
# Timezone default: Asia/Makassar (configurable). Jobs with insufficient data
# are safe no-ops (enabled flags below).

scheduler:
  enabled: true
  timezone: Asia/Makassar
  concurrency: 1
  poll_interval_seconds: 30
  lease_seconds: 300

retry:
  max_attempts: 3
  backoff_seconds: 60
  backoff_factor: 2
  timeout_seconds: 300
  retryable_errors:
    - OperationalError
    - TimeoutError
    - ConnectionError
    - requests.ConnectionError
    - requests.Timeout

jobs:
  research.daily:
    enabled: false            # requires live router/network; stays off in mock
    cron: "0 6 * * *"
  followups.check:
    enabled: true
    cron: "*/30 * * * *"
  analytics.daily:
    enabled: true
    cron: "30 6 * * *"
  analytics.weekly:
    enabled: true
    cron: "30 6 * * 1"
  analytics.monthly:
    enabled: true
    cron: "30 6 1 * *"
  insights.daily:
    enabled: true
    cron: "45 6 * * *"
  insights.weekly:
    enabled: true
    cron: "45 6 * * 1"
  insights.monthly:
    enabled: true
    cron: "45 6 1 * *"
  retention.cleanup:
    enabled: true
    cron: "0 7 1 * *"
  database.backup:
    enabled: true
    cron: "0 5 * * *"
  backup.verify:
    enabled: true
    cron: "0 8 1 * *"
  health.check:
    enabled: true
    cron: "*/15 * * * *"
  production.check:
    enabled: true
    cron: "0 9 * * *"

alert:
  channel: auto               # auto picks telegram/email when creds exist, else log fallback
  dedup_cooldown_minutes: 60
  dedup_window_hours: 24
  telegram_bot_token_env: TELEGRAM_BOT_TOKEN
  telegram_chat_id_env: TELEGRAM_CHAT_ID
  smtp_host_env: SMTP_HOST
  smtp_user_env: SMTP_USER
  smtp_password_env: SMTP_PASSWORD
  smtp_to_env: SMTP_TO
