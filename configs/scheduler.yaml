# Operational scheduler configuration (Phase 3H).
# Timezone default: Asia/Makassar (configurable). Jobs with insufficient data
# are safe no-ops (enabled flags below).

scheduler:
  enabled: true
  timezone: Asia/Makassar
  catchup_minutes: 60   # JOBS-304/CC5 — restart gaps ≤ this still fire
  concurrency: 1
  poll_interval_seconds: 30
  lease_seconds: 300

retry:
  max_attempts: 3
  backoff_seconds: 60
  backoff_factor: 2
  timeout_seconds: 300
  retryable_errors:
    - OperationalError
    - TimeoutError
    - ConnectionError
    - requests.ConnectionError
    - requests.Timeout

jobs:
  research.daily:
    enabled: false            # requires live router/network; stays off in mock
    cron: "0 6 * * *"
  outbox.drain:
    enabled: true
    cron: "* * * * *"          # REAUD: retries/followups never wait for inbound
  followups.check:
    enabled: true
    cron: "*/30 * * * *"
  analytics.daily:
    enabled: true
    cron: "30 6 * * *"
  analytics.weekly:
    enabled: true
    cron: "30 6 * * 1"
  analytics.monthly:
    enabled: true
    cron: "30 6 1 * *"
  insights.daily:
    enabled: true
    cron: "45 6 * * *"
  insights.weekly:
    enabled: true
    cron: "45 6 * * 1"
  insights.monthly:
    enabled: true
    cron: "45 6 1 * *"
  retention.cleanup:
    enabled: true
    cron: "0 7 1 * *"
  database.backup:
    enabled: true
    cron: "0 5 * * *"
  backup.restore_test:
    cron: "0 6 1 * *"        # monthly — prove the latest backup actually restores (BAK-103)
    enabled: true
  backup.verify:
    enabled: true
    cron: "0 8 1 * *"
  health.check:
    enabled: true
    cron: "*/15 * * * *"
  production.check:
    enabled: true
    cron: "0 9 * * *"
  content.autopilot:
    enabled: true
    cron: "0 19 * * *"        # daily at 19:00 (7:00 PM)
  executive.briefing:
    enabled: true
    cron: "0 21 * * *"        # daily at 21:00 (9:00 PM)
  consultation.reminders:
    enabled: true
    cron: "*/5 * * * *"       # checks every 5 minutes for 60m and 15m reminders
  email.poll:
    enabled: true
    cron: "*/5 * * * *"       # IMAP UNSEEN sweep → coordinator (skips when unconfigured)

alert:
  channel: auto               # auto picks telegram/email when creds exist, else log fallback
  dedup_cooldown_minutes: 60
  dedup_cooldown_by_severity: # OBS-102: distinct alerts never share a slot (audit R1)
    CRITICAL: 15
    HIGH: 60
    MEDIUM: 240
    LOW: 240
  dedup_window_hours: 24
  telegram_bot_token_env: TELEGRAM_BOT_TOKEN
  telegram_chat_id_env: TELEGRAM_CHAT_ID
  smtp_host_env: SMTP_HOST
  smtp_user_env: SMTP_USER
  smtp_password_env: SMTP_PASSWORD
  smtp_to_env: SMTP_TO
