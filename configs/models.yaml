defaults:
  timeout_seconds: 60
  max_retries: 2
  monthly_cost_alert_usd: 20

# Effective chain per task: GLM only -> deterministic fallback.
# DeepSeek paused 2026-08-27 (402 no balance) and Gemini capped (20/day):
# definitions kept in `providers:` below, re-add to a chain slot after top-up.
task_routing:
  strategy:    {primary: glm, secondary: null, fallback: null}
  reasoning:   {primary: glm, secondary: null, fallback: null}
  pricing:     {primary: glm, secondary: null, fallback: null}
  coding:      {primary: glm, secondary: null, fallback: null}
  routine:     {primary: glm, secondary: null, fallback: null}
  classification: {primary: glm, secondary: null, fallback: null}
  extraction:  {primary: glm, secondary: null, fallback: null}
  summarization: {primary: glm, secondary: null, fallback: null}
  multimodal:  {primary: gemini, secondary: null, fallback: null}

providers:
  deepseek-v4-pro:
    type: openai_compatible
    base_url_env: DEEPSEEK_BASE_URL
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-v4-pro
  deepseek-v4-flash:
    type: openai_compatible
    base_url_env: DEEPSEEK_BASE_URL
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-v4-flash
  gemini:
    type: gemini
    api_key_env: GEMINI_API_KEY
    model: gemini-3.7-flash
    reasoning_effort: high
  claude:
    type: anthropic
    base_url_env: ANTHROPIC_BASE_URL
    api_key_env: ANTHROPIC_API_KEY
    model: claude-sonnet-4-5
  glm:
    type: openai_compatible
    base_url_env: ZHIPU_BASE_URL
    api_key_env: ZHIPU_API_KEY
    model: glm-5.3-flash
    extra_payload:
      thinking: {level: low}

# USD per 1M tokens (estimates, configurable)
pricing_per_million:
  deepseek-v4-pro:   {input: 2.0, output: 6.0}
  deepseek-v4-flash: {input: 0.2, output: 0.6}
  gemini:            {input: 1.0, output: 4.0}
  claude:            {input: 3.0, output: 15.0}
  glm:               {input: 0.1, output: 0.4}
