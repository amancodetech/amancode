defaults:
  timeout_seconds: 60
  max_retries: 2
  monthly_cost_alert_usd: 20

task_routing:
  strategy:    {primary: deepseek-v4-pro,   secondary: gemini,            fallback: glm}
  reasoning:   {primary: deepseek-v4-pro,   secondary: gemini,            fallback: glm}
  pricing:     {primary: deepseek-v4-pro,   secondary: gemini,            fallback: glm}
  coding:      {primary: deepseek-v4-flash, secondary: glm,               fallback: deepseek-v4-pro}
  routine:     {primary: deepseek-v4-flash, secondary: glm,               fallback: deepseek-v4-pro}
  classification: {primary: deepseek-v4-flash, secondary: glm,            fallback: deepseek-v4-pro}
  extraction:  {primary: deepseek-v4-flash, secondary: glm,               fallback: deepseek-v4-pro}
  summarization: {primary: deepseek-v4-flash, secondary: glm,             fallback: deepseek-v4-pro}
  multimodal:  {primary: gemini,            secondary: deepseek-v4-pro,   fallback: glm}

providers:
  deepseek-v4-pro:
    type: openai_compatible
    base_url_env: DEEPSEEK_BASE_URL
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-v4-pro
  deepseek-v4-flash:
    type: openai_compatible
    base_url_env: DEEPSEEK_BASE_URL
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-v4-flash
  gemini:
    type: gemini
    api_key_env: GEMINI_API_KEY
    model: gemini-3.7-flash
    reasoning_effort: high
  claude:
    type: anthropic
    base_url_env: ANTHROPIC_BASE_URL
    api_key_env: ANTHROPIC_API_KEY
    model: claude-sonnet-4-5
  glm:
    type: openai_compatible
    base_url_env: ZHIPU_BASE_URL
    api_key_env: ZHIPU_API_KEY
    model: glm-5.3-flash

# USD per 1M tokens (estimates, configurable)
pricing_per_million:
  deepseek-v4-pro:   {input: 2.0, output: 6.0}
  deepseek-v4-flash: {input: 0.2, output: 0.6}
  gemini:            {input: 1.0, output: 4.0}
  claude:            {input: 3.0, output: 15.0}
  glm:               {input: 0.1, output: 0.4}
