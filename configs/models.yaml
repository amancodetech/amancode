defaults:
  timeout_seconds: 60
  max_retries: 2
  monthly_cost_alert_usd: 20

# Effective chain: unified routing to deepseek_vision (model: deepseek-v4-flash-vision-exp).
# Voice STT uses AssemblyAI -> transcribed text continues via DeepSeek-Vision-Exp.
task_routing:
  strategy:       {primary: deepseek_vision, secondary: null, fallback: null}
  reasoning:      {primary: deepseek_vision, secondary: null, fallback: null}
  pricing:        {primary: deepseek_vision, secondary: null, fallback: null}
  coding:         {primary: deepseek_vision, secondary: null, fallback: null}
  routine:        {primary: deepseek_vision, secondary: null, fallback: null}
  classification: {primary: deepseek_vision, secondary: null, fallback: null}
  extraction:     {primary: deepseek_vision, secondary: null, fallback: null}
  summarization:  {primary: deepseek_vision, secondary: null, fallback: null}
  multimodal:     {primary: deepseek_vision, secondary: null, fallback: null}

providers:
  deepseek_vision:
    type: openai_compatible
    base_url_env: DEEPSEEK_BASE_URL
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-v4-flash-vision-exp
  gemini:
    type: gemini
    api_key_env: GEMINI_API_KEY
    model: gemini-3.6-flash
  claude:
    type: anthropic
    base_url_env: ANTHROPIC_BASE_URL
    api_key_env: ANTHROPIC_API_KEY
    model: claude-sonnet-4-5
  glm:
    type: openai_compatible
    base_url_env: ZHIPU_BASE_URL
    api_key_env: ZHIPU_API_KEY
    model: glm-5.3-flash

# USD per 1M tokens (estimates, configurable)
# deepseek_vision: image billed max 384 tokens/image at flash input rate
pricing_per_million:
  deepseek_vision: {input: 0.27, output: 1.1}
  gemini:            {input: 1.0, output: 4.0}
  claude:            {input: 3.0, output: 15.0}
  glm:               {input: 0.1, output: 0.4}
