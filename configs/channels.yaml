# Channel configuration (Phase 3E: WhatsApp + Website intake only)

# CUTOVER 2026-08-29 (owner-directed): WhatsApp now runs on the LOCAL BRIDGE
# (Baileys via meta-bridge, 127.0.0.1:8765) — the Meta Cloud API/Graph path
# for WhatsApp is retired. Rollback = `mode: mock` + Graph creds restore.
whatsapp:
  mode: bridge          # bridge (Baileys, local) — graph/mock paths dormant
  api_version: v24.0    # legacy (graph rollback only)
  base_url: https://graph.facebook.com
  inbound_burst_limit: 50
  outbound_per_minute: 10
  auto_reply_low_risk: true
  template_policy: approved_only
  signature_required: false   # bridge ingress authenticates via X-Bridge-Token (local only)
  intake_rate_per_ip_minute: 5
  intake_rate_per_email_day: 3
  max_payload_bytes: 8192
  cors_origin: "*"

telegram:
  # CUSTOMER channel — a SEPARATE bot from the owner console (TELEGRAM_BOT_TOKEN).
  # Official Bot API only. ENABLED 2026-08-26 by owner decision:
  # bot @AmanCode_help_bot, webhook registered w/ secret_token, env vars in .env.
  mode: production               # mock | production (production gated)
  enabled: true                  # master switch — policy DENIES sends while false
  customer_messaging: true       # explicit customer-channel opt-in
  api_base: https://api.telegram.org
  max_text_length: 4096          # official Bot API single-message cap
  signature_required: true       # X-Telegram-Bot-Api-Secret-Token, fail-closed
  bot_token_env: TELEGRAM_CUSTOMER_BOT_TOKEN
  webhook_secret_env: TELEGRAM_CUSTOMER_WEBHOOK_SECRET

facebook:
  # P2-channels (2026-08-27): Messenger DM — same Meta app as WhatsApp.
  mode: production
  enabled: true
  customer_messaging: true
  signature_required: true       # X-Hub-Signature-256, fail-closed
  verify_token_env: META_VERIFY_TOKEN
  app_secret_env: WHATSAPP_APP_SECRET   # one Meta app = one secret
  access_token_env: META_PAGE_ACCESS_TOKEN
  api_version: v21.0

instagram:
  # P2-channels: Instagram DM via the IG professional account linked to the page.
  mode: production
  enabled: true
  customer_messaging: true
  signature_required: true
  verify_token_env: META_VERIFY_TOKEN
  app_secret_env: WHATSAPP_APP_SECRET
  access_token_env: META_IG_ACCESS_TOKEN
  api_version: v21.0

outbox:
  max_attempts: 3
  retry_backoff_seconds: 10
  claim_mode: atomic          # OUT-202: ACTIVE since 2026-08-24 (kills C1+C4)
  stale_after_seconds: 300    # processing rows older than this get reclaimed

# ── Bridge migration (owner spec §8): mode ≠ transport ──────────────────────
# Switching a channel above to `mode: bridge` routes it through the local
# meta-bridge using THIS transport selection. AmanCore never sees the
# transport internals; `shadow: true` = full real path, no external delivery.
# Rollback = `mode: graph` (whatsapp) / declared mode + restart. NOTHING here
# is active until a channel block declares `mode: bridge`.
providers:
  whatsapp:
    transport: baileys          # pinned major version inside the bridge
    base_url: http://127.0.0.1:8765
    token_env: AMANCORE_BRIDGE_TOKEN
    shadow: false
  facebook:
    transport: private          # facebook-chat-api session inside the bridge
    base_url: http://127.0.0.1:8765
    token_env: AMANCORE_BRIDGE_TOKEN
    shadow: false
  instagram:
    transport: realtime         # browser_fallback when realtime is unstable
    browser_fallback: true
    base_url: http://127.0.0.1:8765
    token_env: AMANCORE_BRIDGE_TOKEN
    shadow: false
