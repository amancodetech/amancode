# Production configuration (Phase 3F).
# production_enabled MUST default to false. No agent/service may send a real
# message while production_enabled=false, even if credentials exist.

environment:
  mode: mock              # mock | sandbox | production
  api_version: v24.0
  base_url: https://graph.facebook.com
  webhook_url: "https://webhook.amancam.com/webhook/whatsapp"  # permanent named tunnel (cloudflared-amancore systemd service)
  production_enabled: false

official_verification:
  status: OFFICIAL_VERIFICATION_PENDING
  # api_docs verified live 2026-08-22 against developers.facebook.com official
  # docs: base URL graph.facebook.com, POST /{version}/{phone-number-id}/messages,
  # webhook GET (hub.mode/hub.verify_token/hub.challenge -> 200 challenge),
  # POST signature X-Hub-Signature-256 sha256=HMAC-SHA256(app_secret).
  # Account/phone/webhook/business verification still requires owner access.
  api_docs_verified: true
  account_configuration_verified: false
  business_verification_complete: false
  phone_number_configured: false
  webhook_reachable: false
  webhook_verified: false
  signature_tested: false
  outbound_tested: false
  template_requirements_satisfied: false
  optout_tested: false
  human_takeover_tested: false
  idempotency_tested: false
  outbox_tested: false
  policy_tested: false
  audit_tested: false
  health_pass: false
  owner_alert_configured: false
  secrets_configured: false
  # Backup + recovery drills passed live on 2026-08-22 (backup_id bb6b7820,
  # recovery test status=PASS). Re-run before any enablement.
  backup_verified: true
  recovery_test_passed: true
  runbooks_exist: false
  alert_transport_works: false
  owner_destination_configured: false
