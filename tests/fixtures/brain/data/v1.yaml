# FX policy — USD is the FIXED pricing base. Non-USD markets convert at the
# Brain-pinned daily rate. Every priced correspondence freezes (rate, date)
# inside its approval payload + snapshot, so later rate updates never rewrite
# an issued price. Owner updates USD_IDR + USD_IDR_date together.
fx_rates:
  base_currency: USD
  USD_IDR: 17650
  USD_IDR_date: "2026-09-03"
  USD_IDR_source: "owner-pinned spot USD/IDR ~17,648 (2026-09-03)"

icp:
  primary: Indonesian SME service/trading companies (10-100 employees)
  secondary: Cross-border trading/export companies (Indonesia-GCC-Malaysia)
  opportunistic: clinics, real estate, restaurants, startups, etc.

sales_policy:
  methodology: consultative_selling
  qualification: BANT
  discount_rule: reduce_scope_before_reduce_price
  payment_schedule: ["50% upfront", "50% on delivery"]

negotiation_rules:
  golden_rule: reduce_scope_before_reduce_price
  escalation_below_minimum: true

